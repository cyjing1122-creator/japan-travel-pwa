<div class="pwa-container">
  <div class="nav-bar">
    <span class="nav-title">JAPAN TRAVEL PWA</span>
    <span class="nav-subtitle">日系極簡．商業模組測試</span>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">📷 AI 聰明小票辨識</span>
      <span class="badge">剩餘 2 次免費</span>
    </div>
    
    <div class="plan-options">
      <div class="option active" id="plan-99" onclick="selectPlan(99)">
        <div class="option-title">隨收隨付</div>
        <div class="option-price">NT$ 99 / 50次</div>
      </div>
      <div class="option" id="plan-399" onclick="selectPlan(399)">
        <div class="option-title">無限暢遊 <span class="recommend">推薦</span></div>
        <div class="option-price">NT$ 399 / 終身</div>
      </div>
    </div>

    <button class="btn-primary" id="btn-allowance">購買辨識額度</button>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">🗺️ 達人私房行程推薦</span>
    </div>
    <div class="trip-preview">
      <img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=400&q=80" alt="東京極簡行" class="trip-img">
      <div class="trip-info">
        <div class="trip-name">東京獨立咖啡與極簡美學 5 日自主遊</div>
        <div class="trip-price">NT$ 299 <span class="original-price">NT$ 600</span></div>
      </div>
    </div>
    <button class="btn-secondary" id="btn-trip" style="width: 100%; background: #fff; color: #111; border: 1px solid #111; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 16px;">購買此行程</button>
  </div>
</div>
